<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ExportAI</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main class="popup">
    <header class="title-row">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 5h9.5L14 2.5 15.5 1 21 6.5 15.5 12 14 10.5 16.5 8H9v8h4v3H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm10 10v2h-1.5l2.5 2.5-1.5 1.5L11 15.5l5.5-5.5 1.5 1.5-2.5 2.5H17Z"/></svg>
        </div>
        <div>
          <h1>ExportAI</h1>
          <p id="accountText" class="account-text">ExportAI</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="openOptions" class="icon-button" type="button" aria-label="Settings" title="Settings" data-i18n-aria-label="settingsButton" data-i18n-title="settingsButton">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.05-.3.08-.62.08-.94s-.03-.64-.08-.94l2.06-1.69c.19-.15.25-.41.14-.63l-1.85-3.48c-.11-.21-.36-.31-.59-.24l-2.42.88c-.47-.34-.98-.63-1.55-.85l-.43-2.52c-.03-.23-.23-.39-.47-.39H9.97c-.24 0-.44.16-.47.39l-.43 2.52c-.57.22-1.08.51-1.55.85l-2.42-.88c-.23-.07-.48.03-.59.24L2.66 8.74c-.11.21-.05.47.14.63l2.06 1.69c-.05.3-.08.62-.08.94s.03.64.08.94L2.8 14.63c-.19.15-.25.41-.14.63l1.85 3.48c.11.21.36.31.59.24l2.42-.88c.47.34.98.63 1.55.85l.43 2.52c.03.23.23.39.47.39h4.06c.24 0 .44-.16.47-.39l.43-2.52c.57-.22 1.08-.51 1.55-.85l2.42.88c.23.07.48-.03.59-.24l1.85-3.48c.11-.21.05-.47-.14-.63l-2.06-1.69ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg>
        </button>
      </div>
    </header>

    <div id="status" class="status" role="status" aria-live="polite" hidden>
      <span id="statusText"></span>
      <button id="statusAction" class="status-action" type="button" hidden data-i18n="openInNotion">Open in Notion</button>
    </div>

    <section id="summary" class="summary-card" hidden>
      <div class="summary-row"><span data-i18n="platform">Platform</span><strong id="summaryProvider"></strong></div>
      <div class="summary-row"><span data-i18n="filename">Filename</span><strong id="summaryChatName"></strong></div>
    </section>

    <section id="exportPanel" class="panel" hidden>
      <div class="section-title" data-i18n="chooseExportFormats">Choose export formats</div>
      <div id="formatOptions" class="format-grid"></div>
      <button id="exportButton" class="primary-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10.2l3.6-3.6L18 11l-6 6-6-6 1.4-1.4 3.6 3.6V3Zm-6 16h14v2H5v-2Z"/></svg><span data-i18n="export">Export</span></button>
      <button id="notionButton" class="primary-button notion-button" type="button"><span class="notion-mini-mark" aria-hidden="true">N</span><span id="notionButtonLabel" data-i18n="sendToNotion">Send to Notion</span></button>
    </section>

    <section id="notionFlow" class="notion-flow" hidden>
      <div class="notion-flow-header">
        <button id="notionBackButton" class="notion-back-button" type="button" aria-label="返回">‹</button>
        <strong id="notionFlowTitle">连接 Notion</strong>
        <span aria-hidden="true"></span>
      </div>

      <div id="notionLoginView" class="notion-view" hidden>
        <div class="service-link" aria-hidden="true">
          <span class="service-logo exportai-logo">E</span><span class="service-arrows">⇄</span><span class="service-logo notion-logo">N</span>
        </div>
        <p id="notionLoginHint" class="notion-flow-hint">连接 Notion</p>
      </div>

      <div id="notionWaitingView" class="notion-view notion-waiting-view" hidden>
        <div class="service-link" aria-hidden="true">
          <span class="service-logo exportai-logo">E</span><span class="service-arrows">⇄</span><span class="service-logo notion-logo">N</span>
        </div>
        <strong id="notionWaitingTitle">正在等待 Notion 授权…</strong>
        <p id="notionWaitingText">授权完成后会自动返回这里</p>
      </div>

      <div id="notionTargetsView" class="notion-view" hidden>
        <div class="targets-heading">
          <div><span>选择保存位置</span><small id="notionWorkspaceText">Notion</small></div>
          <button id="notionManageAccess" class="target-settings-button" type="button" title="更新访问权限" aria-label="更新访问权限">⚙</button>
        </div>
        <div class="notion-target-navigation">
          <button id="notionLevelBack" class="notion-level-back" type="button" aria-label="返回上一级" title="返回上一级" hidden>‹</button>
          <div id="notionBreadcrumb" class="notion-breadcrumb">全部页面</div>
        </div>
        <div id="notionTargetList" class="notion-target-list"></div>
        <p id="notionEmptyTargets" class="notion-empty" hidden>没有找到可用页面，请先更新访问权限。</p>
        <button id="notionDisconnect" class="notion-text-button" type="button">断开 Notion 连接</button>
      </div>

      <p id="notionFlowStatus" class="notion-flow-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="../shared/namespace.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="../shared/default-settings.js"></script>
  <script src="../shared/extension-bridge.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/app-theme.js"></script>
  <script src="../shared/button-system.js"></script>
  <script src="./popup.js"></script>
</body>
</html>
